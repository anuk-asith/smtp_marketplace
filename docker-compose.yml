services:
  # ── PostgreSQL (production) ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Bot + webhook server ────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL to point at the compose db service
      DATABASE_URL: postgresql+asyncpg://market:${DB_PASSWORD:-change_me}@db:5432/market
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite DB if you switch to it
      - ./data:/app/data

volumes:
  pgdata:
